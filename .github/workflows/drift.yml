name: drift check

on:
  schedule:
    # 07:00 UTC, Monday to Friday
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      # Demo only: no state is committed, so apply the sample config first to create one.
      # A real setup reads state from a remote backend and drops this step.
      - name: create demo state
        run: |
          terraform -chdir=config init -input=false
          terraform -chdir=config apply -auto-approve -input=false
      - name: run drift check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash scripts/drift.sh config
